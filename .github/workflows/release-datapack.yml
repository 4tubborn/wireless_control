name: 打包并发布数据包

# 触发条件：当你推送（push）带有版本号标签（如 v1.0.0）时触发
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
        contents: write

    steps:
      
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Commit Message
        id: get_msg
        run: |
          # 抓取最近一次提交的完整内容，并处理换行符，写入全局环境变量
          echo "COMMIT_MSG<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 2. 将数据包文件夹打包成 .zip
      # 注意：这里需要根据你的仓库结构调整路径。
      # 如果你的 data 文件夹和 pack.mcmeta 就在仓库根目录下：
      - name: Zip Datapack Artifact
        run: |
          zip -r ${{ github.event.repository.name }}-${{ github.ref_name }}.zip data pack.mcmeta icon.png LICENSE README.md
        # 如果你的数据包在子目录里（例如名叫 wireless-control）：
        # run: |
        #   cd src/wireless-control && zip -r ../../wireless-control-${{ github.ref_name }}.zip ./*

      # 3. 自动创建 GitHub Release 并将打包好的 zip 挂载上去
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Direct Upload to Modrinth via API
        run: |
          # 使用 jq 动态安全地构建 JSON，新增了 version_title 字段
          jq -n \
            --arg pid "8HFrUnlq" \
            --arg vn "${{ github.ref_name }}" \
            --arg vt "Wireless Control ${{ github.ref_name }}" \
            --arg cl "${{ steps.get_msg.outputs.COMMIT_MSG }}" \
            '{
              project_id: $pid,
              version_number: $vn,
              version_title: $vt,
              changelog: $cl,
              dependencies: [],
              game_versions: ["1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.10"],
              version_type: "release",
              loaders: ["datapack"],
              featured: false,
              file_parts: ["file"]
            }' > data.json

          # 用 cURL 直接发送 multipart/form-data 请求
          curl -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: ${{ secrets.MODRINTH_TOKEN }}" \
            -F "data=$(cat data.json)" \
            -F "file=@${{ github.event.repository.name }}-${{ github.ref_name }}.zip"